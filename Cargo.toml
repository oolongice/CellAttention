[package]
name = "cell_attention"
version = "0.1.0"
edition = "2024"

[features]
default = ["ndarray-backend"]
ndarray-backend = ["burn/ndarray", "burn/openblas", "dep:burn-ndarray"]
cuda = ["burn/cuda", "burn/ndarray"]
metal = ["burn/metal"]

[dependencies]
burn = { version = "0.21", default-features = false, features = ["autodiff", "std"] }
burn-ndarray = { version = "0.21", default-features = false, features = ["std", "simd", "multi-threads"], optional = true }
csv = "1"
ndarray = { version = "0.17", features = ["rayon"] }
rand = "0.9"
rand_distr = "0.5"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
